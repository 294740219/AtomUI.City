syntax = "proto3";

option csharp_namespace = "AtomUI.City.Data.HeadlessApp.Grpc";

package datafixture;

service DataProbe {
  rpc Unary (ProbeRequest) returns (ProbeReply);
  rpc ServerStream (ProbeRequest) returns (stream ProbeReply);
  rpc ClientStream (stream ProbeRequest) returns (ProbeReply);
  rpc Duplex (stream ProbeRequest) returns (stream ProbeReply);
}

message ProbeRequest {
  int32 value = 1;
}

message ProbeReply {
  int32 value = 1;
}
